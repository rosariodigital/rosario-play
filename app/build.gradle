plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rosariodigital.play'
    compileSdk 34

    defaultConfig {
        applicationId "com.rosariodigital.play"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
}
